[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maarg"
version = "0.3.1"
description = "Lightweight experiment tracking for Python with zero boilerplate — automatically capture inputs, metrics, artifacts, execution time, and failures with a simple decorator."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
    {name = "Moazzam Matin"}
]
keywords = [
    "experiment-tracking",
    "machine-learning",
    "mlops",
    "experiment-management",
    "tracking",
    "decorator",
    "python",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "mypy", "ruff", "build", "twine"]
plotting = ["matplotlib"]

[project.urls]
Homepage = "https://github.com/Moazzam-Matin/maarg"
Repository = "https://github.com/Moazzam-Matin/maarg"
Issues = "https://github.com/Moazzam-Matin/maarg/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = "matplotlib.*"
ignore_missing_imports = true