
name: Update Changelog Button

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-button:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update release version in SVG
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("docs/assets/changelog_button.svg")
          content = path.read_text(encoding="utf-8")

          tag = os.environ["RELEASE_TAG"]
          updated = re.sub(
              r"CHANGELOG · .*? →",
              f"CHANGELOG · {tag} →",
              content,
          )

          if updated == content and f"CHANGELOG · {tag} →" not in content:
              raise RuntimeError("Could not find the changelog text in the SVG.")

          path.write_text(updated, encoding="utf-8")
          print(f"Updated changelog button to {tag}")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/changelog_button.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update changelog button to ${{ github.event.release.tag_name }}"
            git push origin HEAD:main
          fi